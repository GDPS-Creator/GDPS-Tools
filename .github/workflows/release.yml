name: Auto Build and Release GDPS Tools

on:
  push:
    branches:
      - main

jobs:
  versioning:
    name: Generate version and tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate version
        id: setver
        run: |
          VERSION="diagnostic_1.0.0"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Push tag using PAT
        env:
          TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "GDPS-Creator"
          git config user.email "actions@gdps-tools.local"

          git tag ${{ steps.setver.outputs.version }}

          git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git ${{ steps.setver.outputs.version }}

  build:
    name: Build all modules
    runs-on: ubuntu-latest
    needs: versioning

    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build modules
        run: |
          mkdir -p build

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
          go build -o build/gdps-diagnostic-scanner-${{ matrix.goos }}-${{ matrix.goarch }} \
          "./GDPS Diagnostic Scanner/cmd/scanner"

      - name: Archive binaries
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j build/gdps-tools-windows-amd64.zip build/*
          else
            tar -czf build/gdps-tools-linux-amd64.tar.gz -C build .
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: build/*

  metadata:
    name: Generate metadata
    runs-on: ubuntu-latest
    needs: [versioning, build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate CHANGELOG.md
        run: |
          echo "## Changelog for version ${{ needs.versioning.outputs.version }}" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" -10 >> CHANGELOG.md

      - name: Generate release.json
        run: |
          echo '{' > release.json
          echo '  "version": "'${{ needs.versioning.outputs.version }}'",' >> release.json
          echo '  "generated_at": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'",' >> release.json
          echo '  "modules": [' >> release.json
          echo '    "GDPS Diagnostic Scanner"' >> release.json
          echo '  ]' >> release.json
          echo '}' >> release.json

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: |
            CHANGELOG.md
            release.json

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [versioning, build, metadata]

    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries
          path: release-files

      - name: Download metadata
        uses: actions/download-artifact@v4
        with:
          name: metadata
          path: release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: "GDPS Tools Release ${{ needs.versioning.outputs.version }}"
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
