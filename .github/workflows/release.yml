name: Auto Build and Release GDPS Tools

on:
  push:
    branches:
      - main

jobs:
  versioning:
    name: Generate version and tag
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.setver.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate version
        id: setver
        run: |
          VERSION="diagnostic_1.0.0"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          git config user.name "GDPS-Creator"
          git config user.email "actions@gdps-tools.local"

          # Создаём локальный тег
          git tag ${{ steps.setver.outputs.version }}

          # Отправляем тег напрямую через токен
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git ${{ steps.setver.outputs.version }}

  build:
    name: Build all modules
    runs-on: ubuntu-latest
    needs: versioning

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build modules
        run: |
          mkdir -p build
          
          # Определяем путь к выходному файлу с правильным расширением (.exe для Windows)
          OUT_NAME="gdps-diagnostic-scanner-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          
          # Сборка Go
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags="-s -w" -o "build/${OUT_NAME}" "./GDPS Diagnostic Scanner/cmd/scanner"

      - name: Archive binaries
        run: |
          cd build
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -j gdps-tools-windows-amd64.zip gdps-diagnostic-scanner-windows-amd64.exe
          else
            tar -czf gdps-tools-linux-amd64.tar.gz gdps-diagnostic-scanner-linux-amd64
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}
          path: |
            build/*.zip
            build/*.tar.gz

  metadata:
    name: Generate metadata
    runs-on: ubuntu-latest
    needs: [versioning]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate CHANGELOG.md
        run: |
          echo "## Changelog for version ${{ needs.versioning.outputs.version }}" > CHANGELOG.md
          git log --pretty=format:"- %s (%h)" -10 >> CHANGELOG.md

      - name: Generate release.json
        run: |
          cat <<EOT > release.json
          {
            "version": "${{ needs.versioning.outputs.version }}",
            "generated_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "modules": [
              "GDPS Diagnostic Scanner"
            ]
          }
          EOT

      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: metadata
          path: |
            CHANGELOG.md
            release.json

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [versioning, build, metadata]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          pattern: '*'
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.versioning.outputs.version }}
          name: "GDPS Tools Release ${{ needs.versioning.outputs.version }}"
          body_path: release-files/CHANGELOG.md
          files: |
            release-files/*.zip
            release-files/*.tar.gz
            release-files/release.json
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
